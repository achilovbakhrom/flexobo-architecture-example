name: Database Backup

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - prod

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  backup-rds:
    name: RDS Snapshot Backup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', github.event.inputs.environment)) || fromJson('["dev", "prod"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set environment variables
        id: vars
        run: |
          ENV="${{ matrix.environment }}"
          DATE=$(date +%Y%m%d-%H%M%S)
          echo "db_identifier=flexobo-${ENV}-db" >> $GITHUB_OUTPUT
          echo "snapshot_identifier=flexobo-${ENV}-snapshot-${DATE}" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Create RDS snapshot
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier ${{ steps.vars.outputs.db_identifier }} \
            --db-snapshot-identifier ${{ steps.vars.outputs.snapshot_identifier }} \
            --tags Key=Environment,Value=${{ matrix.environment }} Key=CreatedBy,Value=github-actions Key=Type,Value=automated-backup

          echo "Created snapshot: ${{ steps.vars.outputs.snapshot_identifier }}"

      - name: Wait for snapshot completion
        run: |
          echo "Waiting for snapshot to be available..."
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier ${{ steps.vars.outputs.snapshot_identifier }}
          echo "Snapshot is now available!"

      - name: Copy snapshot to S3 (export)
        run: |
          # Get the S3 bucket name from Terraform output or use convention
          BUCKET="flexobo-db-backups-${{ matrix.environment }}"

          # Export snapshot to S3 (requires IAM role setup)
          aws rds start-export-task \
            --export-task-identifier "export-${{ steps.vars.outputs.date }}" \
            --source-arn "arn:aws:rds:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:snapshot:${{ steps.vars.outputs.snapshot_identifier }}" \
            --s3-bucket-name "$BUCKET" \
            --iam-role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/flexobo-rds-export-role" \
            --kms-key-id "alias/flexobo-${{ matrix.environment }}-secrets" \
            --s3-prefix "rds-exports/${{ steps.vars.outputs.date }}/" || echo "Export task creation skipped (may not be configured)"

      - name: Cleanup old snapshots
        run: |
          # Keep only last 7 daily snapshots
          SNAPSHOTS=$(aws rds describe-db-snapshots \
            --db-instance-identifier ${{ steps.vars.outputs.db_identifier }} \
            --snapshot-type manual \
            --query "DBSnapshots[?contains(DBSnapshotIdentifier, 'automated-backup') || contains(DBSnapshotIdentifier, 'snapshot')]|[:-7].DBSnapshotIdentifier" \
            --output text)

          for snapshot in $SNAPSHOTS; do
            echo "Deleting old snapshot: $snapshot"
            aws rds delete-db-snapshot --db-snapshot-identifier "$snapshot" || true
          done

      - name: Summary
        run: |
          echo "## Database Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ matrix.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ steps.vars.outputs.db_identifier }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snapshot | ${{ steps.vars.outputs.snapshot_identifier }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ steps.vars.outputs.date }} |" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Failure
    needs: backup-rds
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send failure notification
        run: |
          echo "Backup failed! Consider sending notification via Slack, email, or other channels."
          # Add notification logic here (Slack webhook, email, etc.)
