name: Deploy

on:
  push:
    branches:
      - dev   # Auto-deploy to development only
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: 'development'
        options:
          - development
          - staging
          - production
      service:
        description: 'Service to deploy (leave empty for all affected)'
        required: false
        type: choice
        options:
          - ''
          - users-service
          - chat-service
          - file-service
          - main-service
          - billing-service
          - notification-service
          - telegram-service

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
      users-service: ${{ steps.check.outputs.users-service }}
      chat-service: ${{ steps.check.outputs.chat-service }}
      file-service: ${{ steps.check.outputs.file-service }}
      main-service: ${{ steps.check.outputs.main-service }}
      billing-service: ${{ steps.check.outputs.billing-service }}
      notification-service: ${{ steps.check.outputs.notification-service }}
      telegram-service: ${{ steps.check.outputs.telegram-service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Derive SHAs for NX affected
        run: |
          echo "NX_BASE=HEAD~1" >> $GITHUB_ENV
          echo "NX_HEAD=HEAD" >> $GITHUB_ENV

      - name: Get affected projects
        id: affected
        run: |
          # If specific service is selected, use that
          if [ -n "${{ github.event.inputs.service }}" ]; then
            AFFECTED="${{ github.event.inputs.service }}"
          else
            AFFECTED=$(npx nx show projects --affected --type=app 2>/dev/null || echo "")
          fi
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected projects: $AFFECTED"

      - name: Check which services are affected
        id: check
        run: |
          AFFECTED="${{ steps.affected.outputs.affected }}"

          for service in users-service chat-service file-service main-service billing-service notification-service telegram-service; do
            if echo "$AFFECTED" | grep -q "$service"; then
              echo "$service=true" >> $GITHUB_OUTPUT
            else
              echo "$service=false" >> $GITHUB_OUTPUT
            fi
          done

  build-and-push:
    needs: detect-affected
    runs-on: ubuntu-latest
    if: needs.detect-affected.outputs.affected != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: users-service
            affected: ${{ needs.detect-affected.outputs.users-service }}
          - name: chat-service
            affected: ${{ needs.detect-affected.outputs.chat-service }}
          - name: file-service
            affected: ${{ needs.detect-affected.outputs.file-service }}
          - name: main-service
            affected: ${{ needs.detect-affected.outputs.main-service }}
          - name: billing-service
            affected: ${{ needs.detect-affected.outputs.billing-service }}
          - name: notification-service
            affected: ${{ needs.detect-affected.outputs.notification-service }}
          - name: telegram-service
            affected: ${{ needs.detect-affected.outputs.telegram-service }}

    steps:
      - name: Checkout
        if: matrix.affected == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: matrix.affected == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.affected == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: matrix.affected == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        if: matrix.affected == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.name }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infrastructure:
    needs: [detect-affected, build-and-push]
    runs-on: ubuntu-latest
    if: needs.detect-affected.outputs.affected != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ENV="development"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="development"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          case $ENV in
            development)
              echo "cluster_name=flexobo-dev" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-dev" >> $GITHUB_OUTPUT
              echo "overlay=development" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "cluster_name=flexobo-staging" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-staging" >> $GITHUB_OUTPUT
              echo "overlay=staging" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "cluster_name=flexobo-prod" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-prod" >> $GITHUB_OUTPUT
              echo "overlay=production" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ steps.env.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Apply base infrastructure (RabbitMQ, Redis, Vault)
        run: |
          kubectl apply -k k8s/overlays/${{ steps.env.outputs.overlay }}

      - name: Wait for infrastructure to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=rabbitmq -n ${{ steps.env.outputs.namespace }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=redis -n ${{ steps.env.outputs.namespace }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=vault -n ${{ steps.env.outputs.namespace }} --timeout=300s || true

  deploy-services:
    needs: [detect-affected, build-and-push, deploy-infrastructure]
    runs-on: ubuntu-latest
    if: needs.detect-affected.outputs.affected != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: users-service
            affected: ${{ needs.detect-affected.outputs.users-service }}
          - name: chat-service
            affected: ${{ needs.detect-affected.outputs.chat-service }}
          - name: file-service
            affected: ${{ needs.detect-affected.outputs.file-service }}
          - name: main-service
            affected: ${{ needs.detect-affected.outputs.main-service }}
          - name: billing-service
            affected: ${{ needs.detect-affected.outputs.billing-service }}
          - name: notification-service
            affected: ${{ needs.detect-affected.outputs.notification-service }}
          - name: telegram-service
            affected: ${{ needs.detect-affected.outputs.telegram-service }}

    steps:
      - name: Checkout
        if: matrix.affected == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: matrix.affected == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        if: matrix.affected == 'true'
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ENV="development"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="development"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          case $ENV in
            development)
              echo "cluster_name=flexobo-dev" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-dev" >> $GITHUB_OUTPUT
              echo "overlay=development" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "cluster_name=flexobo-staging" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-staging" >> $GITHUB_OUTPUT
              echo "overlay=staging" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "cluster_name=flexobo-prod" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-prod" >> $GITHUB_OUTPUT
              echo "overlay=production" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Update kubeconfig for EKS
        if: matrix.affected == 'true'
        run: aws eks update-kubeconfig --name ${{ steps.env.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.affected == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy ${{ matrix.name }}
        if: matrix.affected == 'true'
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"
          IMAGE="${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:${{ github.sha }}"

          # Update image in kustomization
          cd k8s/overlays/${{ steps.env.outputs.overlay }}

          # Set the new image
          kubectl set image deployment/${{ matrix.name }} ${{ matrix.name }}=$IMAGE -n $NAMESPACE || \
            kubectl patch deployment ${{ matrix.name }} -n $NAMESPACE -p '{"spec":{"template":{"spec":{"containers":[{"name":"${{ matrix.name }}","image":"'$IMAGE'"}]}}}}'

          # Wait for rollout
          kubectl rollout status deployment/${{ matrix.name }} -n $NAMESPACE --timeout=300s

  run-migrations:
    needs: [detect-affected, deploy-services]
    runs-on: ubuntu-latest
    if: needs.detect-affected.outputs.affected != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ENV="development"
          else
            ENV="production"
          fi

          case $ENV in
            development)
              echo "cluster_name=flexobo-dev" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-dev" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "cluster_name=flexobo-staging" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-staging" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "cluster_name=flexobo-prod" >> $GITHUB_OUTPUT
              echo "namespace=flexobo-prod" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ steps.env.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"

          # Run migrations for affected services that have Prisma
          for service in users-service chat-service file-service main-service billing-service notification-service telegram-service; do
            if [ -f "apps/$service/prisma/schema.prisma" ]; then
              echo "Running migrations for $service..."
              # Execute prisma migrate deploy in the running pod
              kubectl exec -n $NAMESPACE deployment/$service -- npx prisma migrate deploy || echo "Migration for $service skipped or failed"
            fi
          done
