name: Deploy

on:
  push:
    branches:
      - dev   # Auto-deploy to development
      - main  # Auto-deploy to production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: 'development'
        options:
          - development
          - production
      service:
        description: 'Service to deploy (leave empty for affected only)'
        required: false
        type: string
        default: ''

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # Detect which services have changed using Nx
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      affected_services: ${{ steps.affected.outputs.services }}
      has_changes: ${{ steps.affected.outputs.has_changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get last successful deployment SHA
        id: last-sha
        run: |
          # Try to get the last successful deployment SHA from git tags or use default
          BRANCH="${{ github.ref_name }}"

          # Look for deployment tag
          LAST_SHA=$(git tag -l "deployed-${BRANCH}-*" --sort=-creatordate | head -1 | sed "s/deployed-${BRANCH}-//" || echo "")

          if [ -z "$LAST_SHA" ]; then
            # Fallback: compare against previous commit or main branch
            if [ "$BRANCH" = "main" ]; then
              LAST_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            else
              LAST_SHA=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
            fi
          fi

          echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          echo "Last deployment SHA: $LAST_SHA"

      - name: Determine affected services
        id: affected
        run: |
          # If specific service is provided via workflow_dispatch, use that
          if [ -n "${{ github.event.inputs.service }}" ]; then
            SERVICES="${{ github.event.inputs.service }}"
            echo "Manual deployment of: $SERVICES"
          else
            # Use Nx to detect affected apps
            export NX_BASE="${{ steps.last-sha.outputs.last_sha }}"
            export NX_HEAD="HEAD"

            echo "Comparing $NX_BASE to $NX_HEAD"

            # Get affected apps (services)
            AFFECTED_RAW=$(npx nx show projects --affected --type=app 2>/dev/null || echo "")

            # Filter to only our microservices
            SERVICES=""
            for svc in auth-service main-service users-service billing-service chat-service notification-service file-service telegram-service; do
              if echo "$AFFECTED_RAW" | grep -qw "$svc"; then
                if [ -n "$SERVICES" ]; then
                  SERVICES="$SERVICES,$svc"
                else
                  SERVICES="$svc"
                fi
              fi
            done

            echo "Affected services: $SERVICES"
          fi

          # Output results
          if [ -n "$SERVICES" ]; then
            echo "services=$SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "services=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create matrix
        id: matrix
        run: |
          SERVICES="${{ steps.affected.outputs.services }}"

          if [ -z "$SERVICES" ]; then
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            # Convert comma-separated to JSON array
            JSON_ARRAY=$(echo "$SERVICES" | tr ',' '\n' | jq -R . | jq -s -c .)
            echo "matrix={\"service\":$JSON_ARRAY}" >> $GITHUB_OUTPUT
          fi

          echo "Matrix: $(cat $GITHUB_OUTPUT | grep matrix)"

      - name: Summary
        run: |
          echo "## Deployment Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base SHA | ${{ steps.last-sha.outputs.last_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Head SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Affected Services | ${{ steps.affected.outputs.services }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Has Changes | ${{ steps.affected.outputs.has_changes }} |" >> $GITHUB_STEP_SUMMARY

  # Build and push Docker images for affected services only
  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # Deploy to Kubernetes
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    strategy:
      fail-fast: false
      max-parallel: 2  # Deploy 2 services at a time to avoid overwhelming the cluster
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="development"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          case $ENV in
            development)
              echo "cluster_name=flexobo-dev" >> $GITHUB_OUTPUT
              echo "namespace=flexobo" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "cluster_name=flexobo-prod" >> $GITHUB_OUTPUT
              echo "namespace=flexobo" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ steps.env.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy ${{ matrix.service }}
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"
          IMAGE="${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.service }}:${{ github.sha }}"

          echo "Deploying ${{ matrix.service }} to $NAMESPACE"
          echo "Image: $IMAGE"

          # Update deployment image
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=$IMAGE \
            -n $NAMESPACE

          # Wait for rollout
          kubectl rollout status deployment/${{ matrix.service }} \
            -n $NAMESPACE \
            --timeout=300s

      - name: Verify Istio sidecar
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"

          # Check if pod has Istio sidecar
          POD=$(kubectl get pod -n $NAMESPACE -l app=${{ matrix.service }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

          if [ -n "$POD" ]; then
            CONTAINERS=$(kubectl get pod $POD -n $NAMESPACE -o jsonpath='{.spec.containers[*].name}')
            if echo "$CONTAINERS" | grep -q "istio-proxy"; then
              echo "✅ Istio sidecar is running"
            else
              echo "⚠️ Istio sidecar not detected"
            fi
          fi

      - name: Run health check
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"

          # Wait for pod to be ready
          kubectl wait --for=condition=ready pod \
            -l app=${{ matrix.service }} \
            -n $NAMESPACE \
            --timeout=120s

          echo "✅ ${{ matrix.service }} is healthy"

  # Run migrations only for affected services
  migrate:
    name: Migrate ${{ matrix.service }}
    needs: [detect-changes, deploy]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1  # Run migrations sequentially
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if service has Prisma
        id: check-prisma
        run: |
          if [ -f "apps/${{ matrix.service }}/prisma/schema.prisma" ]; then
            echo "has_prisma=true" >> $GITHUB_OUTPUT
          else
            echo "has_prisma=false" >> $GITHUB_OUTPUT
            echo "No Prisma schema found for ${{ matrix.service }}, skipping migration"
          fi

      - name: Configure AWS credentials
        if: steps.check-prisma.outputs.has_prisma == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        if: steps.check-prisma.outputs.has_prisma == 'true'
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="development"
          fi

          case $ENV in
            development)
              echo "cluster_name=flexobo-dev" >> $GITHUB_OUTPUT
              echo "namespace=flexobo" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "cluster_name=flexobo-prod" >> $GITHUB_OUTPUT
              echo "namespace=flexobo" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Update kubeconfig
        if: steps.check-prisma.outputs.has_prisma == 'true'
        run: |
          aws eks update-kubeconfig \
            --name ${{ steps.env.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Run migrations for ${{ matrix.service }}
        if: steps.check-prisma.outputs.has_prisma == 'true'
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"

          echo "Running Prisma migrations for ${{ matrix.service }}..."

          # Get the pod name
          POD=$(kubectl get pod -n $NAMESPACE -l app=${{ matrix.service }} -o jsonpath='{.items[0].metadata.name}')

          # Run migration
          kubectl exec -n $NAMESPACE $POD -- npx prisma migrate deploy || {
            echo "⚠️ Migration failed for ${{ matrix.service }}"
            exit 1
          }

          echo "✅ Migrations completed for ${{ matrix.service }}"

  # Tag successful deployment
  tag-deployment:
    name: Tag Deployment
    needs: [detect-changes, deploy, migrate]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag successful deployment
        run: |
          BRANCH="${{ github.ref_name }}"
          TAG="deployed-${BRANCH}-${{ github.sha }}"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create lightweight tag
          git tag "$TAG"
          git push origin "$TAG" || echo "Tag already exists"

          echo "Tagged deployment: $TAG"

      - name: Cleanup old deployment tags
        run: |
          BRANCH="${{ github.ref_name }}"

          # Keep only last 10 deployment tags per branch
          TAGS=$(git tag -l "deployed-${BRANCH}-*" --sort=-creatordate | tail -n +11)

          for tag in $TAGS; do
            git push origin --delete "$tag" 2>/dev/null || true
            git tag -d "$tag" 2>/dev/null || true
          done

  # Deployment summary
  summary:
    name: Deployment Summary
    needs: [detect-changes, build, deploy, migrate]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Create summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detection | ${{ needs.detect-changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrate | ${{ needs.migrate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.affected_services }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Check the workflow logs for details."
          # Add Slack/email notification here if needed
