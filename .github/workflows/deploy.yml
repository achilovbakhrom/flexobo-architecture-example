name: Deploy

on:
  push:
    branches:
      - dev   # Auto-deploy to development only
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (production only - development is automatic)'
        required: true
        type: choice
        default: 'production'
        options:
          - production
      service:
        description: 'Service to deploy (leave empty for all affected)'
        required: false
        type: choice
        options:
          - ''
          - users-service
          - chat-service
          - file-service
          - main-service
          - billing-service
          - notification-service
          - telegram-service

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
      users-service: ${{ steps.check.outputs.users-service }}
      chat-service: ${{ steps.check.outputs.chat-service }}
      file-service: ${{ steps.check.outputs.file-service }}
      main-service: ${{ steps.check.outputs.main-service }}
      billing-service: ${{ steps.check.outputs.billing-service }}
      notification-service: ${{ steps.check.outputs.notification-service }}
      telegram-service: ${{ steps.check.outputs.telegram-service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Derive SHAs for NX affected
        run: |
          echo "NX_BASE=HEAD~1" >> $GITHUB_ENV
          echo "NX_HEAD=HEAD" >> $GITHUB_ENV

      - name: Get affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --type=app 2>/dev/null || echo "")
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected projects: $AFFECTED"

      - name: Check which services are affected
        id: check
        run: |
          AFFECTED="${{ steps.affected.outputs.affected }}"

          for service in users-service chat-service file-service main-service billing-service notification-service telegram-service; do
            if echo "$AFFECTED" | grep -q "$service"; then
              echo "$service=true" >> $GITHUB_OUTPUT
            else
              echo "$service=false" >> $GITHUB_OUTPUT
            fi
          done

  build-and-push:
    needs: detect-affected
    runs-on: ubuntu-latest
    if: needs.detect-affected.outputs.affected != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: users-service
            affected: ${{ needs.detect-affected.outputs.users-service }}
          - name: chat-service
            affected: ${{ needs.detect-affected.outputs.chat-service }}
          - name: file-service
            affected: ${{ needs.detect-affected.outputs.file-service }}
          - name: main-service
            affected: ${{ needs.detect-affected.outputs.main-service }}
          - name: billing-service
            affected: ${{ needs.detect-affected.outputs.billing-service }}
          - name: notification-service
            affected: ${{ needs.detect-affected.outputs.notification-service }}
          - name: telegram-service
            affected: ${{ needs.detect-affected.outputs.telegram-service }}

    steps:
      - name: Checkout
        if: matrix.affected == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: matrix.affected == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.affected == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: matrix.affected == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        if: matrix.affected == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.name }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/flexobo/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-development:
    needs: [detect-affected, build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_DEV }} --region ${{ env.AWS_REGION }}

      - name: Deploy users-service
        if: needs.detect-affected.outputs.users-service == 'true'
        run: |
          kubectl apply -k apps/users-service/k8s/overlays/development
          kubectl set image deployment/users-service users-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/users-service:${{ github.sha }} -n users-service
          kubectl rollout status deployment/users-service -n users-service --timeout=300s

      - name: Deploy chat-service
        if: needs.detect-affected.outputs.chat-service == 'true'
        run: |
          kubectl apply -k apps/chat-service/k8s/overlays/development
          kubectl set image deployment/chat-service chat-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/chat-service:${{ github.sha }} -n chat-service
          kubectl rollout status deployment/chat-service -n chat-service --timeout=300s

      - name: Deploy file-service
        if: needs.detect-affected.outputs.file-service == 'true'
        run: |
          kubectl apply -k apps/file-service/k8s/overlays/development
          kubectl set image deployment/file-service file-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/file-service:${{ github.sha }} -n file-service
          kubectl rollout status deployment/file-service -n file-service --timeout=300s

      - name: Deploy main-service
        if: needs.detect-affected.outputs.main-service == 'true'
        run: |
          kubectl apply -k apps/main-service/k8s/overlays/development
          kubectl set image deployment/main-service main-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/main-service:${{ github.sha }} -n main-service
          kubectl rollout status deployment/main-service -n main-service --timeout=300s

      - name: Deploy billing-service
        if: needs.detect-affected.outputs.billing-service == 'true'
        run: |
          kubectl apply -k apps/billing-service/k8s/overlays/development
          kubectl set image deployment/billing-service billing-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/billing-service:${{ github.sha }} -n billing-service
          kubectl rollout status deployment/billing-service -n billing-service --timeout=300s

      - name: Deploy notification-service
        if: needs.detect-affected.outputs.notification-service == 'true'
        run: |
          kubectl apply -k apps/notification-service/k8s/overlays/development
          kubectl set image deployment/notification-service notification-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/notification-service:${{ github.sha }} -n notification-service
          kubectl rollout status deployment/notification-service -n notification-service --timeout=300s

      - name: Deploy telegram-service
        if: needs.detect-affected.outputs.telegram-service == 'true'
        run: |
          kubectl apply -k apps/telegram-service/k8s/overlays/development
          kubectl set image deployment/telegram-service telegram-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/telegram-service:${{ github.sha }} -n telegram-service
          kubectl rollout status deployment/telegram-service -n telegram-service --timeout=300s

  deploy-production:
    needs: [detect-affected, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_PROD }} --region ${{ env.AWS_REGION }}

      - name: Deploy users-service
        if: needs.detect-affected.outputs.users-service == 'true'
        run: |
          kubectl apply -k apps/users-service/k8s/overlays/production
          kubectl set image deployment/users-service users-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/users-service:${{ github.sha }} -n users-service
          kubectl rollout status deployment/users-service -n users-service --timeout=300s

      - name: Deploy chat-service
        if: needs.detect-affected.outputs.chat-service == 'true'
        run: |
          kubectl apply -k apps/chat-service/k8s/overlays/production
          kubectl set image deployment/chat-service chat-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/chat-service:${{ github.sha }} -n chat-service
          kubectl rollout status deployment/chat-service -n chat-service --timeout=300s

      - name: Deploy file-service
        if: needs.detect-affected.outputs.file-service == 'true'
        run: |
          kubectl apply -k apps/file-service/k8s/overlays/production
          kubectl set image deployment/file-service file-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/file-service:${{ github.sha }} -n file-service
          kubectl rollout status deployment/file-service -n file-service --timeout=300s

      - name: Deploy main-service
        if: needs.detect-affected.outputs.main-service == 'true'
        run: |
          kubectl apply -k apps/main-service/k8s/overlays/production
          kubectl set image deployment/main-service main-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/main-service:${{ github.sha }} -n main-service
          kubectl rollout status deployment/main-service -n main-service --timeout=300s

      - name: Deploy billing-service
        if: needs.detect-affected.outputs.billing-service == 'true'
        run: |
          kubectl apply -k apps/billing-service/k8s/overlays/production
          kubectl set image deployment/billing-service billing-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/billing-service:${{ github.sha }} -n billing-service
          kubectl rollout status deployment/billing-service -n billing-service --timeout=300s

      - name: Deploy notification-service
        if: needs.detect-affected.outputs.notification-service == 'true'
        run: |
          kubectl apply -k apps/notification-service/k8s/overlays/production
          kubectl set image deployment/notification-service notification-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/notification-service:${{ github.sha }} -n notification-service
          kubectl rollout status deployment/notification-service -n notification-service --timeout=300s

      - name: Deploy telegram-service
        if: needs.detect-affected.outputs.telegram-service == 'true'
        run: |
          kubectl apply -k apps/telegram-service/k8s/overlays/production
          kubectl set image deployment/telegram-service telegram-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flexobo/telegram-service:${{ github.sha }} -n telegram-service
          kubectl rollout status deployment/telegram-service -n telegram-service --timeout=300s
