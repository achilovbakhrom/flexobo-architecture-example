apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: order-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres-order:5432/order_service"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  JWT_SECRET: "your-order-service-jwt-secret-change-in-production"
  POSTGRES_PASSWORD: "postgres"
