# InfisicalSecret - Syncs secrets from Infisical to K8s Secret
# The Infisical operator watches this and creates/updates the K8s secret
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: order-service-secrets
  namespace: order-service
spec:
  # Reference to the Infisical authentication
  authentication:
    serviceToken:
      serviceTokenSecretReference:
        secretName: infisical-service-token
        secretNamespace: order-service
  # Which secrets to sync
  managedSecretReference:
    secretName: order-service-secrets  # K8s secret name to create
    secretNamespace: order-service
    secretType: Opaque
  # Infisical project and environment
  hostAPI: http://infisical.flexobo-infra.svc.cluster.local:8080/api
  projectId: ""  # Set after creating project in Infisical
  environment: "production"
  secretsPath: "/order-service"
  # Sync settings
  resyncInterval: 60  # seconds
---
# Service Token Secret (created after setting up Infisical)
# This is a placeholder - replace with actual service token
apiVersion: v1
kind: Secret
metadata:
  name: infisical-service-token
  namespace: order-service
type: Opaque
stringData:
  serviceToken: "st.xxx.xxx"  # Replace with actual Infisical service token
