apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-order
  namespace: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-order
  template:
    metadata:
      labels:
        app: redis-order
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-order
  namespace: order-service
spec:
  type: ClusterIP
  selector:
    app: redis-order
  ports:
    - port: 6379
      targetPort: 6379
