# ===========================================
# Order Service - Docker Compose
# ===========================================
# Prerequisites: Start shared infrastructure first
#   cd infrastructure && docker-compose up -d
#
# Then run: docker-compose up -d

services:
  # ===========================================
  # Order Service Application
  # ===========================================
  order-service:
    build:
      context: ../..
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      postgres-order:
        condition: service_healthy
      redis-order:
        condition: service_healthy
    networks:
      - order-service-network
      - flexobo-shared-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================
  # PostgreSQL Database (service-specific)
  # ===========================================
  postgres-order:
    image: postgres:15-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_service
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - order-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache (service-specific)
  # ===========================================
  redis-order:
    image: redis:7-alpine
    container_name: order-service-redis
    command: redis-server --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis_order_data:/data
    networks:
      - order-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_order_data:
    driver: local
  redis_order_data:
    driver: local

networks:
  order-service-network:
    driver: bridge
  flexobo-shared-network:
    external: true
