version: '3.8'

services:
  notification-postgres:
    image: postgres:15-alpine
    container_name: notification-service-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_service
    ports:
      - '5441:5432'
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  notification-redis:
    image: redis:7-alpine
    container_name: notification-service-redis
    ports:
      - '6390:6379'
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notification-postgres-data:
  notification-redis-data:
