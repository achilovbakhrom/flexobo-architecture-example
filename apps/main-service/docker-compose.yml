services:
  main-service-db:
    image: postgres:15-alpine
    container_name: main-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_service
    ports:
      - '5439:5432'
    volumes:
      - main_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  main_service_data:
