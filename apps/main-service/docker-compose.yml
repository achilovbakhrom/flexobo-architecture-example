services:
  main-service-db:
    image: postgres:15-alpine
    container_name: main-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_service
    ports:
      - '5438:5432'
    volumes:
      - main_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-main:
    image: redis:7-alpine
    container_name: main-service-redis
    command: redis-server --appendonly yes
    ports:
      - '6385:6379'
    volumes:
      - redis_main_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  main_service_data:
  redis_main_data:
