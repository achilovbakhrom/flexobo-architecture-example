# ===========================================
# Main Service - Docker Compose
# ===========================================
# Prerequisites: Start shared infrastructure first
#   cd infrastructure && docker-compose up -d
#
# Then run: docker-compose up -d

services:
  # ===========================================
  # Main Service Application
  # ===========================================
  main-service:
    build:
      context: ../..
      dockerfile: apps/main-service/Dockerfile
    container_name: main-service
    ports:
      - "3006:3006"
    env_file:
      - .env
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - main-service-network
      - flexobo-shared-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================
  # PostgreSQL Database (service-specific)
  # ===========================================
  postgres-main:
    image: postgres:16-alpine
    container_name: main-service-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_service
    ports:
      - "5438:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    networks:
      - main-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_main_data:
    driver: local

networks:
  main-service-network:
    driver: bridge
  flexobo-shared-network:
    external: true
