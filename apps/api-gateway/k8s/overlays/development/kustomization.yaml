apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-gateway-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: api-gateway

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
