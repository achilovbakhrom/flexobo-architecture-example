# InfisicalSecret - Syncs secrets from Infisical to K8s Secret
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: api-gateway-secrets
  namespace: api-gateway
spec:
  authentication:
    serviceToken:
      serviceTokenSecretReference:
        secretName: infisical-service-token
        secretNamespace: api-gateway
  managedSecretReference:
    secretName: api-gateway-secrets
    secretNamespace: api-gateway
    secretType: Opaque
  hostAPI: http://infisical.flexobo-infra.svc.cluster.local:8080/api
  projectId: ""  # Set after creating project in Infisical
  environment: "production"
  secretsPath: "/api-gateway"
  resyncInterval: 60
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-service-token
  namespace: api-gateway
type: Opaque
stringData:
  serviceToken: "st.xxx.xxx"  # Replace with actual Infisical service token
