apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: api-gateway
data:
  NODE_ENV: "production"
  API_GATEWAY_PORT: "3001"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "*"
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT: "60000"
  CIRCUIT_BREAKER_RESET_TIMEOUT: "30000"
  ORDER_SERVICE_URL: "http://order-service.order-service.svc.cluster.local:3000"
  ADMIN_PANEL_URL: "http://admin-panel.admin-panel.svc.cluster.local:3002"
  OTEL_SERVICE_NAME: "api-gateway"
