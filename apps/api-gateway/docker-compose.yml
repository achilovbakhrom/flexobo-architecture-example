# ===========================================
# API Gateway - Docker Compose
# ===========================================
# Prerequisites: Start shared infrastructure first
#   cd infrastructure && docker-compose up -d
#
# Then run: docker-compose up -d

services:
  # ===========================================
  # API Gateway Application
  # ===========================================
  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    depends_on:
      redis-gateway:
        condition: service_healthy
    networks:
      - api-gateway-network
      - flexobo-shared-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================
  # Redis (for rate limiting and caching)
  # ===========================================
  redis-gateway:
    image: redis:7-alpine
    container_name: api-gateway-redis
    command: redis-server --appendonly yes
    ports:
      - "6382:6379"
    volumes:
      - redis_gateway_data:/data
    networks:
      - api-gateway-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_gateway_data:
    driver: local

networks:
  api-gateway-network:
    driver: bridge
  flexobo-shared-network:
    external: true
