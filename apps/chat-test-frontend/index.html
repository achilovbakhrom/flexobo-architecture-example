<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Service Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
    .container { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 300px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #0f3460; }
    .sidebar-header h2 { font-size: 18px; margin-bottom: 10px; }
    .connection-status { font-size: 12px; padding: 5px 10px; border-radius: 4px; display: inline-block; }
    .status-connected { background: #00c853; color: #000; }
    .status-disconnected { background: #ff5252; }

    /* Auth Section */
    .auth-section { padding: 15px; border-bottom: 1px solid #0f3460; }
    .auth-section input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #eee; }
    .auth-section button { width: 100%; padding: 10px; background: #e94560; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: bold; }
    .auth-section button:hover { background: #ff6b6b; }

    /* Rooms List */
    .rooms-section { flex: 1; overflow-y: auto; }
    .rooms-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
    .rooms-header h3 { font-size: 14px; text-transform: uppercase; color: #888; }
    .create-room-btn { background: #0f3460; border: none; color: #eee; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .room-list { list-style: none; }
    .room-item { padding: 15px; border-bottom: 1px solid #0f3460; cursor: pointer; transition: background 0.2s; }
    .room-item:hover { background: #0f3460; }
    .room-item.active { background: #0f3460; border-left: 3px solid #e94560; }
    .room-name { font-weight: 500; margin-bottom: 5px; }
    .room-preview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { background: #e94560; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; float: right; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 20px; background: #16213e; border-bottom: 1px solid #0f3460; }
    .chat-header h2 { font-size: 16px; }
    .chat-header .room-info { font-size: 12px; color: #888; margin-top: 5px; }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; }
    .message.sent { align-self: flex-end; background: #e94560; }
    .message.received { align-self: flex-start; background: #0f3460; }
    .message.system { align-self: center; background: #333; font-size: 12px; color: #888; }
    .message-content { word-wrap: break-word; }
    .message-meta { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 5px; }
    .message-file { margin-top: 8px; }
    .message-file img { max-width: 200px; max-height: 200px; border-radius: 8px; }
    .message-file a { color: #4fc3f7; text-decoration: none; }

    /* Input Area */
    .input-area { padding: 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
    .input-area input[type="text"] { flex: 1; padding: 12px; border: 1px solid #0f3460; border-radius: 8px; background: #1a1a2e; color: #eee; }
    .input-area button { padding: 12px 24px; background: #e94560; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; }
    .input-area button:hover { background: #ff6b6b; }
    .file-input-wrapper { position: relative; }
    .file-input-wrapper input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .file-input-wrapper button { pointer-events: none; }

    /* Typing Indicator */
    .typing-indicator { padding: 10px 20px; font-size: 12px; color: #888; font-style: italic; }

    /* Log Panel */
    .log-panel { width: 350px; background: #0d1b2a; border-left: 1px solid #0f3460; display: flex; flex-direction: column; }
    .log-header { padding: 15px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; }
    .log-header h3 { font-size: 14px; }
    .clear-log { background: none; border: none; color: #888; cursor: pointer; }
    .log-content { flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; }
    .log-entry { padding: 5px; border-bottom: 1px solid #0f3460; }
    .log-entry.event { color: #4fc3f7; }
    .log-entry.error { color: #ff5252; }
    .log-entry.send { color: #00c853; }
    .log-entry .timestamp { color: #666; }

    /* Create Room Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #16213e; padding: 30px; border-radius: 12px; width: 400px; }
    .modal-content h3 { margin-bottom: 20px; }
    .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #eee; }
    .modal-content label { display: block; margin-bottom: 5px; font-size: 12px; color: #888; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
    .modal-actions .cancel { background: #333; color: #eee; }
    .modal-actions .confirm { background: #e94560; color: #fff; }

    /* Empty State */
    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chat Test Client</h2>
        <span id="connectionStatus" class="connection-status status-disconnected">Disconnected</span>
      </div>

      <div class="auth-section">
        <input type="text" id="tokenInput" placeholder="JWT Token">
        <input type="text" id="userIdInput" placeholder="User ID (for display)">
        <button onclick="connect()">Connect</button>
      </div>

      <div class="rooms-section">
        <div class="rooms-header">
          <h3>Rooms</h3>
          <button class="create-room-btn" onclick="showCreateRoomModal()">+ New</button>
        </div>
        <ul id="roomList" class="room-list"></ul>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div id="chatHeader" class="chat-header" style="display: none;">
        <h2 id="currentRoomName">Room Name</h2>
        <div class="room-info">
          <span id="currentRoomId"></span> |
          <span id="currentRoomParticipants"></span>
        </div>
      </div>

      <div id="emptyState" class="empty-state">
        <p>Select a room to start chatting</p>
      </div>

      <div id="messagesContainer" class="messages" style="display: none;"></div>

      <div id="typingIndicator" class="typing-indicator" style="display: none;"></div>

      <div id="inputArea" class="input-area" style="display: none;">
        <div class="file-input-wrapper">
          <input type="file" id="fileInput" onchange="uploadFile()">
          <button>📎</button>
        </div>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Log Panel -->
    <div class="log-panel">
      <div class="log-header">
        <h3>Event Log</h3>
        <button class="clear-log" onclick="clearLog()">Clear</button>
      </div>
      <div id="logContent" class="log-content"></div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div id="createRoomModal" class="modal">
    <div class="modal-content">
      <h3>Create New Room</h3>
      <label>Participant IDs (comma separated)</label>
      <input type="text" id="participantIds" placeholder="user-id-1, user-id-2">
      <label>Group Name (optional)</label>
      <input type="text" id="groupName" placeholder="My Group Chat">
      <label>
        <input type="checkbox" id="isGroup"> Is Group Chat
      </label>
      <div class="modal-actions">
        <button class="cancel" onclick="hideCreateRoomModal()">Cancel</button>
        <button class="confirm" onclick="createRoom()">Create</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const CHAT_SERVICE_URL = 'http://localhost:3006';
    const FILE_SERVICE_URL = 'http://localhost:3007';

    // State
    let socket = null;
    let currentRoom = null;
    let currentUserId = null;
    let token = null;
    let rooms = [];

    // Socket.IO Connection
    function connect() {
      token = document.getElementById('tokenInput').value.trim();
      currentUserId = document.getElementById('userIdInput').value.trim();

      if (!token) {
        log('Please enter a JWT token', 'error');
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      log(`Connecting to ${CHAT_SERVICE_URL}...`, 'send');

      socket = io(`${CHAT_SERVICE_URL}/chat`, {
        auth: { token },
        transports: ['websocket', 'polling'],
        reconnection: false
      });

      // Connection events
      socket.on('connect', () => {
        log('Connected successfully!', 'event');
        updateConnectionStatus(true);
        loadUserRooms();
      });

      socket.on('disconnect', (reason) => {
        log(`Disconnected: ${reason}`, 'error');
        updateConnectionStatus(false);
      });

      socket.on('connect_error', (error) => {
        log(`Connection error: ${error.message}`, 'error');
        updateConnectionStatus(false);
      });

      socket.on('error', (error) => {
        log(`Error: ${JSON.stringify(error)}`, 'error');
      });

      // Chat events
      socket.on('joined_room', (data) => {
        log(`Joined room: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('receive_message', (message) => {
        log(`New message: ${JSON.stringify(message)}`, 'event');
        if (message && message.roomId === currentRoom?.id) {
          appendMessage(message);
        }
        updateRoomPreview(message.roomId, message);
      });

      socket.on('chat_history', (messages) => {
        log(`Chat history received: ${messages?.length || 0} messages`, 'event');
        if (Array.isArray(messages)) {
          displayMessages(messages);
        }
      });

      socket.on('user_typing', (data) => {
        log(`User typing: ${JSON.stringify(data)}`, 'event');
        showTypingIndicator(data);
      });

      socket.on('message_read', (data) => {
        log(`Message read: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('room_read', (data) => {
        log(`Room read: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('unread_count_updated', (data) => {
        log(`Unread count updated: ${JSON.stringify(data)}`, 'event');
        updateRoomUnreadCount(data.roomId, data.unreadCount);
      });

      socket.on('message_edited', (data) => {
        log(`Message edited: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('message_deleted', (data) => {
        log(`Message deleted: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('online_users', (data) => {
        log(`Online users: ${JSON.stringify(data)}`, 'event');
      });

      // Bid events
      socket.on('bid_created', (data) => {
        log(`Bid created: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('bid_updated', (data) => {
        log(`Bid updated: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('bid_cancelled', (data) => {
        log(`Bid cancelled: ${JSON.stringify(data)}`, 'event');
      });
    }

    function updateConnectionStatus(connected) {
      const el = document.getElementById('connectionStatus');
      if (connected) {
        el.textContent = 'Connected';
        el.className = 'connection-status status-connected';
      } else {
        el.textContent = 'Disconnected';
        el.className = 'connection-status status-disconnected';
      }
    }

    // Room Management
    async function loadUserRooms() {
      try {
        const response = await fetch(`${CHAT_SERVICE_URL}/api/v1/chat/rooms`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        rooms = data.data || [];
        renderRoomList();
        log(`Loaded ${rooms.length} rooms`, 'event');
      } catch (error) {
        log(`Failed to load rooms: ${error.message}`, 'error');
      }
    }

    function renderRoomList() {
      const container = document.getElementById('roomList');
      container.innerHTML = rooms.map(room => `
        <li class="room-item ${currentRoom?.id === room.id ? 'active' : ''}" onclick="selectRoom('${room.id}')">
          <div class="room-name">
            ${room.groupName || room.participants.filter(p => p !== currentUserId).join(', ') || 'Chat Room'}
            ${room.unreadCounts?.[currentUserId] > 0 ? `<span class="unread-badge">${room.unreadCounts[currentUserId]}</span>` : ''}
          </div>
          <div class="room-preview">${room.lastMessagePreview || 'No messages yet'}</div>
        </li>
      `).join('');
    }

    function selectRoom(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      currentRoom = room;
      renderRoomList();

      // Show chat UI
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'block';
      document.getElementById('messagesContainer').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';

      // Update header
      document.getElementById('currentRoomName').textContent = room.groupName || 'Chat Room';
      document.getElementById('currentRoomId').textContent = `ID: ${room.id}`;
      document.getElementById('currentRoomParticipants').textContent = `Participants: ${room.participants.join(', ')}`;

      // Join room and load history
      socket.emit('join_room', { roomId });
      log(`Emitted join_room: ${roomId}`, 'send');

      socket.emit('load_history', { roomId, limit: 50 });
      log(`Emitted load_history: ${roomId}`, 'send');
    }

    function showCreateRoomModal() {
      document.getElementById('createRoomModal').classList.add('active');
    }

    function hideCreateRoomModal() {
      document.getElementById('createRoomModal').classList.remove('active');
    }

    async function createRoom() {
      const participantIds = document.getElementById('participantIds').value
        .split(',')
        .map(id => id.trim())
        .filter(id => id);

      if (!participantIds.includes(currentUserId)) {
        participantIds.push(currentUserId);
      }

      const groupName = document.getElementById('groupName').value.trim();
      const isGroup = document.getElementById('isGroup').checked;

      try {
        const response = await fetch(`${CHAT_SERVICE_URL}/api/v1/chat/rooms`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            participants: participantIds,
            isGroup,
            groupName: groupName || undefined
          })
        });

        const data = await response.json();
        log(`Room created: ${JSON.stringify(data)}`, 'event');

        hideCreateRoomModal();
        loadUserRooms();
      } catch (error) {
        log(`Failed to create room: ${error.message}`, 'error');
      }
    }

    // Messaging
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();

      if (!content || !currentRoom) return;

      socket.emit('send_message', {
        roomId: currentRoom.id,
        content,
        type: 'text'
      });

      log(`Emitted send_message: ${content}`, 'send');
      input.value = '';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      } else {
        // Emit typing event
        if (currentRoom) {
          socket.emit('typing', { roomId: currentRoom.id, isTyping: true });
        }
      }
    }

    function displayMessages(messages) {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      messages.forEach(msg => appendMessage(msg));
      container.scrollTop = container.scrollHeight;
    }

    function appendMessage(message) {
      const container = document.getElementById('messagesContainer');
      const isSent = message.senderId === currentUserId;
      const isSystem = message.type === 'status' || message.senderId === 'SYSTEM';

      let contentHtml = message.content || '';

      // Handle file messages
      if (message.fileUrls?.length > 0) {
        const fileUrl = message.fileUrls[0];
        const isImage = message.type === 'image' || message.type === 'gif';

        if (isImage) {
          contentHtml += `<div class="message-file"><img src="${fileUrl}" alt="${message.fileName || 'Image'}"></div>`;
        } else {
          contentHtml += `<div class="message-file"><a href="${fileUrl}" target="_blank">📎 ${message.fileName || 'File'}</a></div>`;
        }
      }

      const msgEl = document.createElement('div');
      msgEl.className = `message ${isSystem ? 'system' : isSent ? 'sent' : 'received'}`;
      msgEl.innerHTML = `
        <div class="message-content">${contentHtml}</div>
        <div class="message-meta">
          ${message.senderId} | ${new Date(message.createdAt).toLocaleTimeString()}
          ${message.isRead ? ' ✓✓' : ' ✓'}
        </div>
      `;

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    function updateRoomPreview(roomId, message) {
      const room = rooms.find(r => r.id === roomId);
      if (room) {
        room.lastMessagePreview = message.content || `[${message.type}]`;
        renderRoomList();
      }
    }

    function updateRoomUnreadCount(roomId, count) {
      const room = rooms.find(r => r.id === roomId);
      if (room) {
        room.unreadCounts = room.unreadCounts || {};
        room.unreadCounts[currentUserId] = count;
        renderRoomList();
      }
    }

    function showTypingIndicator(data) {
      const el = document.getElementById('typingIndicator');
      if (data.isTyping && data.userId !== currentUserId) {
        el.textContent = `${data.userId} is typing...`;
        el.style.display = 'block';

        // Auto hide after 3 seconds
        setTimeout(() => {
          el.style.display = 'none';
        }, 3000);
      } else {
        el.style.display = 'none';
      }
    }

    // File Upload
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file || !currentRoom) {
        log('No file selected or no room active', 'error');
        return;
      }

      log(`Uploading file: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`, 'send');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch(
          `${FILE_SERVICE_URL}/api/v1/files/chat/upload?chatId=${currentRoom.id}`,
          {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          }
        );

        const data = await response.json();

        if (response.ok) {
          log(`File uploaded: ${JSON.stringify(data)}`, 'event');
        } else {
          log(`File upload failed: ${JSON.stringify(data)}`, 'error');
        }
      } catch (error) {
        log(`File upload error: ${error.message}`, 'error');
      }

      fileInput.value = '';
    }

    // Logging
    function log(message, type = 'event') {
      const container = document.getElementById('logContent');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;

      const timestamp = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;

      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }

    function clearLog() {
      document.getElementById('logContent').innerHTML = '';
    }

    // Initialize
    log('Chat Test Client Ready. Enter your JWT token and click Connect.', 'event');
  </script>
</body>
</html>
