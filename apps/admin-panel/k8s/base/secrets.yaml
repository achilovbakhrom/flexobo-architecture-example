apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-secrets
  namespace: admin-panel
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres-admin:5432/admin_panel"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  JWT_SECRET: "your-admin-panel-jwt-secret-change-in-production"
  POSTGRES_PASSWORD: "postgres"
