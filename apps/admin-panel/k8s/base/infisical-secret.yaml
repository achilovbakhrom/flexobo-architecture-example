# InfisicalSecret - Syncs secrets from Infisical to K8s Secret
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: admin-panel-secrets
  namespace: admin-panel
spec:
  authentication:
    serviceToken:
      serviceTokenSecretReference:
        secretName: infisical-service-token
        secretNamespace: admin-panel
  managedSecretReference:
    secretName: admin-panel-secrets
    secretNamespace: admin-panel
    secretType: Opaque
  hostAPI: http://infisical.flexobo-infra.svc.cluster.local:8080/api
  projectId: ""  # Set after creating project in Infisical
  environment: "production"
  secretsPath: "/admin-panel"
  resyncInterval: 60
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-service-token
  namespace: admin-panel
type: Opaque
stringData:
  serviceToken: "st.xxx.xxx"  # Replace with actual Infisical service token
