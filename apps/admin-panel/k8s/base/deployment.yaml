apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: admin-panel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
        version: v1
    spec:
      containers:
        - name: admin-panel
          image: flexobo/admin-panel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: ADMIN_PANEL_PORT
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: ADMIN_PANEL_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: LOG_LEVEL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: REDIS_PORT
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: ORDER_SERVICE_URL
            - name: GATEWAY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: admin-panel-config
                  key: GATEWAY_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel
  namespace: admin-panel
spec:
  type: ClusterIP
  selector:
    app: admin-panel
  ports:
    - port: 3002
      targetPort: 3002
      name: http
