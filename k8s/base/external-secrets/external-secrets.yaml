# External Secrets for Flexobo services
# These sync secrets from AWS Secrets Manager to Kubernetes
---
# JWT Secret (shared across services)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: flexobo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: flexobo/dev/jwt  # Format: {project}/{environment}/jwt
        property: secret
---
# Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: flexobo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_HOST: "{{ .host }}"
        DATABASE_PORT: "{{ .port }}"
        DATABASE_USERNAME: "{{ .username }}"
        DATABASE_PASSWORD: "{{ .password }}"
        # Connection strings for each service schema
        AUTH_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=auth"
        MAIN_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=main"
        USERS_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=users"
        BILLING_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=billing"
        CHAT_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=chat"
        NOTIFICATION_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=notification"
        FILE_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=file"
        TELEGRAM_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/flexobo?schema=telegram"
  data:
    - secretKey: host
      remoteRef:
        key: flexobo/dev/database
        property: host
    - secretKey: port
      remoteRef:
        key: flexobo/dev/database
        property: port
    - secretKey: username
      remoteRef:
        key: flexobo/dev/database
        property: username
    - secretKey: password
      remoteRef:
        key: flexobo/dev/database
        property: password
---
# API Keys (Stripe, Click, Telegram)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: flexobo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-keys
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: flexobo/dev/api-keys
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: flexobo/dev/api-keys
        property: stripe_webhook_secret
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: flexobo/dev/api-keys
        property: telegram_bot_token
    - secretKey: CLICK_SECRET_KEY
      remoteRef:
        key: flexobo/dev/api-keys
        property: click_secret_key
---
# OpenSearch credentials (for Jaeger)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opensearch-credentials
  namespace: flexobo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: opensearch-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_URL: "https://{{ .endpoint }}"
        OPENSEARCH_USERNAME: "{{ .username }}"
        OPENSEARCH_PASSWORD: "{{ .password }}"
  data:
    - secretKey: endpoint
      remoteRef:
        key: flexobo/dev/opensearch
        property: endpoint
    - secretKey: username
      remoteRef:
        key: flexobo/dev/opensearch
        property: username
    - secretKey: password
      remoteRef:
        key: flexobo/dev/opensearch
        property: password
