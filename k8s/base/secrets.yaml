apiVersion: v1
kind: Secret
metadata:
  name: flexobo-secrets
  namespace: flexobo
type: Opaque
stringData:
  # JWT Secret - CHANGE IN PRODUCTION
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"

  # Database URL template - will be overridden per environment
  # Format: postgresql://user:password@host:port/dbname?schema=schemaname
  DATABASE_URL: "postgresql://postgres:postgres@rds-endpoint:5432/flexobo"

  # Billing Service
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
  CLICK_SECRET_KEY: "click_placeholder"

  # Telegram Service
  TELEGRAM_BOT_TOKEN: "telegram_bot_token_placeholder"

  # Notification Service
  SMS_API_KEY: "sms_api_key_placeholder"
  EMAIL_API_KEY: "email_api_key_placeholder"

  # Google OAuth (users-service)
  GOOGLE_CLIENT_ID: "google_client_id_placeholder"
  GOOGLE_CLIENT_SECRET: "google_client_secret_placeholder"
