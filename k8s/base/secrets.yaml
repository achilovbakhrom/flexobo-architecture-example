apiVersion: v1
kind: Secret
metadata:
  name: flexobo-secrets
  namespace: flexobo
type: Opaque
stringData:
  # Database credentials (base64 encoded in production)
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  
  # RabbitMQ credentials
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  
  # JWT Secret (CHANGE IN PRODUCTION!)
  JWT_SECRET: your-secret-key-change-in-production
  
  # Database URLs (separate databases per service)
  DATABASE_URL: postgresql://postgres:postgres@postgres-order-service:5432/order_db
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres-admin-service:5432/admin_db
  
  # RabbitMQ URL
  RABBITMQ_URL: amqp://guest:guest@rabbitmq-service:5672
