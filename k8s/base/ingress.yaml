apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flexobo-ingress
  namespace: flexobo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.flexobo.com
        - admin.flexobo.com
      secretName: flexobo-tls
  rules:
    - host: api.flexobo.com
      http:
        paths:
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 3003
          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 3004
          - path: /api/v1/files
            pathType: Prefix
            backend:
              service:
                name: file-service
                port:
                  number: 3005
          - path: /api/v1/loads
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 3006
          - path: /api/v1/trips
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 3006
          - path: /api/v1/bids
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 3006
          - path: /api/v1/companies
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 3006
          - path: /api/v1/billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 3007
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3008
          - path: /api/v1/telegram
            pathType: Prefix
            backend:
              service:
                name: telegram-service
                port:
                  number: 3009
    - host: admin.flexobo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-panel
                port:
                  number: 3002
