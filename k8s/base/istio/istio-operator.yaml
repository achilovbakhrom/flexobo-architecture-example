# Istio Operator Configuration
# Version: 1.28.1 (December 2025)
# Documentation: https://istio.io/latest/docs/reference/config/istio.operator.v1alpha1/
# Install Istio first: istioctl install -f istio-operator.yaml
---
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istio-control-plane
  namespace: istio-system
spec:
  # Use the default profile as base
  profile: default

  # Mesh configuration
  meshConfig:
    # Enable access logging
    accessLogFile: /dev/stdout
    accessLogFormat: |
      [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
      %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%
      "%REQ(X-FORWARDED-FOR)%" "%REQ(USER-AGENT)%" "%REQ(X-REQUEST-ID)%"
      "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%" %UPSTREAM_CLUSTER% %UPSTREAM_LOCAL_ADDRESS%
      %DOWNSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_REMOTE_ADDRESS% %REQUESTED_SERVER_NAME%

    # Enable tracing to Jaeger
    enableTracing: true
    defaultConfig:
      tracing:
        sampling: 100.0  # 100% sampling for dev, reduce in prod
        zipkin:
          address: jaeger-collector.monitoring.svc.cluster.local:9411

      # Proxy configuration
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_DNS_AUTO_ALLOCATE: "true"

    # Outbound traffic policy (ALLOW_ANY or REGISTRY_ONLY)
    outboundTrafficPolicy:
      mode: ALLOW_ANY

    # Enable mTLS (will be STRICT in PeerAuthentication)
    enableAutoMtls: true

  # Component configuration
  components:
    # Control plane (istiod)
    pilot:
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        hpaSpec:
          minReplicas: 1
          maxReplicas: 3
          metrics:
            - type: Resource
              resource:
                name: cpu
                targetAverageUtilization: 80
        # Pod disruption budget
        podDisruptionBudget:
          minAvailable: 1

    # Ingress gateway (disabled - using Kong instead)
    ingressGateways:
      - name: istio-ingressgateway
        enabled: false

    # Egress gateway (optional, enable for strict egress control)
    egressGateways:
      - name: istio-egressgateway
        enabled: false

  # Global values
  values:
    global:
      # Proxy settings
      proxy:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # Auto-inject sidecar
        autoInject: enabled

      # Use distroless images for security
      tag: "1.28.1-distroless"

      # Enable Prometheus metrics
      meshID: flexobo-mesh
      network: ""

    # Pilot settings
    pilot:
      traceSampling: 100.0

    # Telemetry settings
    telemetry:
      enabled: true
      v2:
        enabled: true
        prometheus:
          enabled: true
