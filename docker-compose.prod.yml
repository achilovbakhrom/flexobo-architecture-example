# Production-like environment for local testing
# Usage: docker-compose -f docker-compose.prod.yml up

services:
  # ============================================
  # Order Service Infrastructure
  # ============================================

  postgres-order:
    image: postgres:15-alpine
    container_name: flexobo-postgres-order-prod
    environment:
      POSTGRES_USER: ${POSTGRES_ORDER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASSWORD:-postgres}
      POSTGRES_DB: order_service
    ports:
      - "${POSTGRES_ORDER_PORT:-5432}:5432"
    volumes:
      - postgres_order_prod_data:/var/lib/postgresql/data
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis-order:
    image: redis:7-alpine
    container_name: flexobo-redis-order-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_ORDER_PASSWORD:-redis_password}
    ports:
      - "${REDIS_ORDER_PORT:-6379}:6379"
    volumes:
      - redis_order_prod_data:/data
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_ORDER_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # Admin Panel Infrastructure
  # ============================================

  postgres-admin:
    image: postgres:15-alpine
    container_name: flexobo-postgres-admin-prod
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: admin_panel
    ports:
      - "${POSTGRES_ADMIN_PORT:-5433}:5432"
    volumes:
      - postgres_admin_prod_data:/var/lib/postgresql/data
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis-admin:
    image: redis:7-alpine
    container_name: flexobo-redis-admin-prod
    command: redis-server --appendonly yes --port 6380 --requirepass ${REDIS_ADMIN_PASSWORD:-redis_password}
    ports:
      - "${REDIS_ADMIN_PORT:-6380}:6380"
    volumes:
      - redis_admin_prod_data:/data
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "--pass", "${REDIS_ADMIN_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # Shared Infrastructure
  # ============================================

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flexobo-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin_password}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================
  # Application Services (Dockerized)
  # ============================================

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: flexobo-order-service-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres-order:5432/order_service
      REDIS_URL: redis://:redis_password@redis-order:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres-order:
        condition: service_healthy
      redis-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    container_name: flexobo-admin-panel-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres-admin:5432/admin_panel
      REDIS_URL: redis://:redis_password@redis-admin:6380
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres-admin:
        condition: service_healthy
      redis-admin:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: flexobo-api-gateway-prod
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3001
      ORDER_SERVICE_URL: http://order-service:3000
      ADMIN_PANEL_URL: http://admin-panel:3002
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      - order-service
      - admin-panel
    networks:
      - flexobo-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  postgres_order_prod_data:
    driver: local
  redis_order_prod_data:
    driver: local
  postgres_admin_prod_data:
    driver: local
  redis_admin_prod_data:
    driver: local
  rabbitmq_prod_data:
    driver: local

networks:
  flexobo-prod-network:
    driver: bridge
