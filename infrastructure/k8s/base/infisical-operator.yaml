# Infisical Kubernetes Operator
# This operator syncs secrets from Infisical to K8s Secrets
# Install via Helm: helm install infisical-secrets-operator infisical/secrets-operator
#
# Prerequisites:
# 1. helm repo add infisical https://dl.infisical.com/charts
# 2. helm repo update
# 3. helm install infisical-secrets-operator infisical/secrets-operator -n flexobo-infra
#
# After installing the operator, create InfisicalSecret resources for each service

---
# Service Account for the operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-operator
  namespace: flexobo-infra
---
# ClusterRole for the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infisical-operator-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets.infisical.com"]
    resources: ["infisicalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets.infisical.com"]
    resources: ["infisicalsecrets/status"]
    verbs: ["get", "update", "patch"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infisical-operator-role
subjects:
  - kind: ServiceAccount
    name: infisical-operator
    namespace: flexobo-infra
