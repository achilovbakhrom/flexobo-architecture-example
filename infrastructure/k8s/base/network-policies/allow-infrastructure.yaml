# Network policies for infrastructure components
---
# RabbitMQ: Allow from all flexobo services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-policy
  namespace: flexobo
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flexobo
      ports:
        - protocol: TCP
          port: 5672   # AMQP
        - protocol: TCP
          port: 15672  # Management UI
  egress:
    # Allow to other RabbitMQ nodes (clustering)
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 4369   # epmd
        - protocol: TCP
          port: 25672  # Erlang distribution
---
# Redis: Allow from all flexobo services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: flexobo
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flexobo
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow to other Redis nodes (clustering/sentinel)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379  # Cluster bus
        - protocol: TCP
          port: 26379  # Sentinel
---
# Allow Prometheus to scrape metrics from all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: flexobo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090  # Prometheus metrics
        - protocol: TCP
          port: 3000  # App metrics endpoint
---
# Allow Jaeger agent to send traces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger-egress
  namespace: flexobo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: flexobo
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: UDP
          port: 6831   # Jaeger agent thrift
        - protocol: TCP
          port: 14268  # Jaeger collector HTTP
        - protocol: TCP
          port: 4317   # OTLP gRPC
        - protocol: TCP
          port: 4318   # OTLP HTTP
