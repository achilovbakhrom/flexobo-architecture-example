apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flexobo

resources:
  # Core infrastructure
  - namespace.yaml
  - storage-class.yaml
  - configmap.yaml

  # Security & RBAC (apply first)
  - rbac
  - network-policies

  # External Secrets (replaces static secrets.yaml)
  - external-secrets

  # Message queue and cache
  - rabbitmq
  - redis

  # Microservices
  - services/auth-service
  - services/users-service
  - services/chat-service
  - services/file-service
  - services/main-service
  - services/billing-service
  - services/notification-service
  - services/telegram-service

  # Istio policies (after services)
  - istio

  # Monitoring namespace
  - monitoring

# Note: The following are installed via Helm and managed separately:
# - cert-manager (infrastructure/k8s/base/cert-manager/helm-values.yaml)
# - kong (infrastructure/k8s/base/kong/helm-values.yaml)
# - prometheus-stack (infrastructure/k8s/base/monitoring/prometheus/helm-values.yaml)
# - grafana (infrastructure/k8s/base/monitoring/grafana/helm-values.yaml)
# - loki (infrastructure/k8s/base/monitoring/loki/helm-values.yaml)
# - jaeger (infrastructure/k8s/base/monitoring/jaeger/helm-values.yaml)
# - rancher (infrastructure/k8s/rancher/helm-values.yaml)

commonLabels:
  app.kubernetes.io/name: flexobo
  app.kubernetes.io/part-of: flexobo
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  security.flexobo.com/reviewed: "true"
