apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Note: No global namespace set - each resource defines its own namespace

resources:
  # Core infrastructure - flexobo namespace
  - namespace.yaml
  - storage-class.yaml
  - configmap.yaml

  # Security & RBAC
  - rbac
  - network-policies

  # Message queue and cache
  - rabbitmq
  - redis

  # Microservices (all in flexobo namespace)
  # Note: auth-service removed - no source code exists
  - services/users-service
  - services/chat-service
  - services/file-service
  - services/main-service
  - services/billing-service
  - services/notification-service
  - services/telegram-service

# Note: The following have their own namespaces and should be applied separately:
# - external-secrets: kubectl apply -k infrastructure/k8s/base/external-secrets
# - istio: istioctl install -f infrastructure/k8s/base/istio/istio-operator.yaml
# - monitoring: kubectl apply -k infrastructure/k8s/base/monitoring
#
# Helm charts (installed separately):
# - cert-manager (infrastructure/k8s/base/cert-manager/helm-values.yaml)
# - kong (infrastructure/k8s/base/kong/helm-values.yaml)
# - prometheus-stack (infrastructure/k8s/base/monitoring/prometheus/helm-values.yaml)
# - loki (infrastructure/k8s/base/monitoring/loki/helm-values.yaml)
# - jaeger (infrastructure/k8s/base/monitoring/jaeger/helm-values.yaml)

commonLabels:
  app.kubernetes.io/name: flexobo
  app.kubernetes.io/part-of: flexobo
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  security.flexobo.com/reviewed: "true"
