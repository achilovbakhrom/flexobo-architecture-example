apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: flexobo
  labels:
    app: file-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
        tier: backend
    spec:
      containers:
        - name: file-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/flexobo/file-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3007
              name: http
          envFrom:
            - configMapRef:
                name: flexobo-config
            - secretRef:
                name: flexobo-secrets
          env:
            - name: PORT
              value: "3007"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@$(DB_HOST):5432/flexobo?schema=files"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: file-service
                topologyKey: kubernetes.io/hostname
