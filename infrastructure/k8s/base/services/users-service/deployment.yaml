apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: flexobo
  labels:
    app: users-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
        tier: backend
    spec:
      serviceAccountName: default
      containers:
        - name: users-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/flexobo/users-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
              name: http
            - containerPort: 50052
              name: grpc
          envFrom:
            - configMapRef:
                name: flexobo-config
            - secretRef:
                name: flexobo-secrets
          env:
            - name: PORT
              value: "3005"
            - name: GRPC_PORT
              value: "50052"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@$(DB_HOST):5432/flexobo?schema=users"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: users-service
                topologyKey: kubernetes.io/hostname
