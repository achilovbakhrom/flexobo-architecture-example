apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infisical-mongo
  namespace: flexobo-infra
spec:
  serviceName: infisical-mongo
  replicas: 1
  selector:
    matchLabels:
      app: infisical-mongo
  template:
    metadata:
      labels:
        app: infisical-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "infisical"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: infisical-mongo
  namespace: flexobo-infra
spec:
  type: ClusterIP
  selector:
    app: infisical-mongo
  ports:
    - port: 27017
      targetPort: 27017
