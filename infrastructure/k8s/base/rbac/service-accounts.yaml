# Service Accounts for Flexobo microservices
# Each service has its own ServiceAccount for IRSA (IAM Roles for Service Accounts)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: flexobo
  annotations:
    # IRSA annotation - role ARN will be set by Terraform output
    eks.amazonaws.com/role-arn: ""
  labels:
    app: auth-service
    app.kubernetes.io/part-of: flexobo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: main-service
  namespace: flexobo
  annotations:
    eks.amazonaws.com/role-arn: ""
  labels:
    app: main-service
    app.kubernetes.io/part-of: flexobo
---
