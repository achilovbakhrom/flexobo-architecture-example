# Health check endpoints (no auth required)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-checks
  namespace: flexobo
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: api.flexobo.com
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: main-service
                port:
                  number: 3000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: main-service
                port:
                  number: 3000
---
# File upload endpoint (larger size limit)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-upload
  namespace: flexobo
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: jwt-auth,request-size-limit,global-cors
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - api.flexobo.com
      secretName: flexobo-api-tls
  rules:
    - host: api.flexobo.com
      http:
        paths:
          - path: /api/v1/files
            pathType: Prefix
            backend:
              service:
                name: file-service
                port:
                  number: 3000
