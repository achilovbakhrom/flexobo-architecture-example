# Kong Ingress Configuration for Flexobo Services
# Using Gateway API (preferred for Kong 3.x)
# Documentation: https://docs.konghq.com/kubernetes-ingress-controller/latest/
---
# Kong Ingress Class
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: kong
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress-controllers.konghq.com/kong
---
# Main API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flexobo-api
  namespace: flexobo
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: jwt-auth,global-rate-limit,global-cors,global-request-id,security-headers
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - api.flexobo.com
        - dev.api.flexobo.com
      secretName: flexobo-api-tls
  rules:
    # Production API
    - host: api.flexobo.com
