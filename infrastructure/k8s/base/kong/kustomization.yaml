# Kong Kustomization
# Note: Install Kong via Helm first before applying these
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - kong-plugins.yaml
  - kong-ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: flexobo
  app.kubernetes.io/managed-by: kustomize
