# Loki Helm Values - Simplified for Dev
# Chart: grafana/loki
# Install: helm install loki grafana/loki -n monitoring -f helm-values.yaml

# Loki configuration
loki:
  # Authentication
  auth_enabled: false

  # Common configuration
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  # Schema configuration - use filesystem for dev
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Storage configuration - filesystem for dev (simpler)
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  # Limits configuration (removed deprecated fields)
  limits_config:
    retention_period: 168h  # 7 days for dev
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 5000

# Deployment mode
deploymentMode: SingleBinary

# Single binary mode configuration
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

# Disable scalable mode components (must be 0 for SingleBinary)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable chunksCache for dev (simplify)
chunksCache:
  enabled: false

# Disable resultsCache for dev
resultsCache:
  enabled: false

# Service account
serviceAccount:
  create: true
  name: loki

# Gateway configuration
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Monitoring
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: true
