# Istio system namespace
# Version: 1.28.1 (December 2025)
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-injection: disabled
    app.kubernetes.io/name: istio
    app.kubernetes.io/component: system
---
# Enable Istio injection for flexobo namespace
apiVersion: v1
kind: Namespace
metadata:
  name: flexobo
  labels:
    istio-injection: enabled
    app.kubernetes.io/part-of: flexobo
