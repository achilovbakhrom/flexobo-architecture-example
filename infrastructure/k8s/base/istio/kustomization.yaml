# Istio Kustomization
# Note: Install Istio first using istioctl before applying these
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - peer-authentication.yaml
  - authorization-policies.yaml
  - destination-rules.yaml

commonLabels:
  app.kubernetes.io/part-of: flexobo
  app.kubernetes.io/managed-by: kustomize
