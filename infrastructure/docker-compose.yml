# ===========================================
# Shared Infrastructure - Docker Compose
# ===========================================
# Starts shared infrastructure that all services depend on
# Usage: docker-compose up -d
#
# This must be running before starting any microservice locally
#
# Access:
#   - RabbitMQ Management: http://localhost:15672 (guest/guest)

services:
  # ===========================================
  # RabbitMQ Message Broker
  # ===========================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flexobo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - flexobo-shared-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
    driver: local

networks:
  flexobo-shared-network:
    driver: bridge
    name: flexobo-shared-network
