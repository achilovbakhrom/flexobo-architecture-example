services:
  # ============================================
  # Order Service Infrastructure
  # ============================================

  # Order Service - PostgreSQL Database
  postgres-order:
    image: postgres:15-alpine
    container_name: flexobo-postgres-order-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - flexobo-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Order Service - Redis Cache
  redis-order:
    image: redis:7-alpine
    container_name: flexobo-redis-order-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_order_data:/data
    networks:
      - flexobo-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Admin Panel Infrastructure
  # ============================================

  # Admin Panel - PostgreSQL Database
  postgres-admin:
    image: postgres:15-alpine
    container_name: flexobo-postgres-admin-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_panel
    ports:
      - "5433:5432"
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    networks:
      - flexobo-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin Panel - Redis Cache
  redis-admin:
    image: redis:7-alpine
    container_name: flexobo-redis-admin-dev
    command: redis-server --appendonly yes --port 6380
    ports:
      - "6380:6380"
    volumes:
      - redis_admin_data:/data
    networks:
      - flexobo-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Shared Infrastructure
  # ============================================

  # RabbitMQ Message Broker (Shared for inter-service communication)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flexobo-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - flexobo-dev-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  # Order Service volumes
  postgres_order_data:
    driver: local
  redis_order_data:
    driver: local

  # Admin Panel volumes
  postgres_admin_data:
    driver: local
  redis_admin_data:
    driver: local

  # Shared volumes
  rabbitmq_dev_data:
    driver: local

networks:
  flexobo-dev-network:
    driver: bridge
